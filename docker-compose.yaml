services:
  jetson:
    image: jetson_humble:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jetson_humble

    # Jetson ホスト上の ROS 2 graph へ DDS で直接参加する。
    network_mode: host
    # Fast DDS は host network の参加者を同一ホストと判定して SHM を選ぶため、
    # ホストとコンテナで IPC namespace も共有する必要がある。
    ipc: host
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    # D455 (librealsense RSUSB backend) は libusb で /dev/bus/usb を直接開く。
    # 抜き差しや rs-fw-update 時の再列挙に追従できるよう devices ではなく bind する。
    device_cgroup_rules:
      - "c 189:* rmw"

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # 別コンテナの Isaac ROS cuVSLAM と同じ Fast DDS に揃え、SHM で画像を渡す。
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      # docker compose exec jetson bash -c "..." のような非対話 bash 用。
      BASH_ENV: /etc/minicar/ros_setup.bash

    volumes:
      - ./maps:/maps:rw
      - ./bags:/bags:rw
      - /dev/bus/usb:/dev/bus/usb

    # センサとその静的TFのみ自動起動。SLAM・MPPIは手動起動する。
    # D455 は ENABLE_CAMERA=true のときだけ起動する(camera_mount.yaml の実測設定が必要)。
    command:
      - ros2
      - launch
      - minicar_bringup
      - sensors.launch.py
      - enable_camera:=${ENABLE_CAMERA:-false}
    restart: unless-stopped
    stdin_open: true
    tty: true

  # センサの無いPCでrosbagを再生してscan_filter・SLAMを検証する。
  # docker compose --profile replay up -d replay で起動する(README「PCでbag再生」)。
  replay:
    image: jetson_humble:latest
    container_name: jetson_humble_replay
    profiles: [replay]
    environment:
      # 同じLANの実機graphと混ざらないよう、別Domainかつlocalhost限定にする。
      ROS_DOMAIN_ID: ${REPLAY_ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: 1
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      BASH_ENV: /etc/minicar/ros_setup.bash
    volumes:
      - ./maps:/maps:rw
      - ./bags:/bags:rw
      # 検証条件ごとの scan_filter / slam_toolbox パラメータ。
      - ./replay_params:/replay_params:rw
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
