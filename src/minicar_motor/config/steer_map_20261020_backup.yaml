# 退避: 2026-10-20 実測の舵角マップ (2026-11-05 に新マップへ置き換えた旧版)。
#
# 舵の PWM 端点が left 310 / center 385 / right 423 だったときの実測。
# 10-21 (500cb04) に端点を 284 / 450 へ広げたのに u を直さなかったため、
# 置き換え前は左で約 1.35 倍、右で約 1.7 倍切れすぎていた。
# 端点を 310 / 385 / 423 に戻したときだけ使える。
#
# 戻すときは、motor_driver_params.yaml の後ろにこのファイルを足して起動する
# (後から読んだ --params-file が勝つ):
#
#   ros2 run minicar_motor motor_driver_node --ros-args \
#     --params-file $CFG/motor_driver_params.yaml \
#     --params-file $CFG/steer_map_20261020_backup.yaml \
#     ...
#
# 実測 (2026-10-20、接地、v 0.3 m/s で半周させ、外側後輪の軌跡の半径 r を
# メジャーで測った)。R = r - 0.083、delta = atan(0.257 / R)。
#
#   u      カウント  r [m]   delta
#   +1.0   310       0.943   +16.6°  (+0.2904)
#   +0.8   325       1.208   +12.9°  (+0.2247)
#   +0.6   340       1.627    +9.5°  (+0.1650)
#   +0.4   355       3.143    +4.8°  (+0.0838)
#   -0.4   400       2.938    -5.1°  (-0.0898)
#   -0.6   408       2.082    -7.3°  (-0.1279)
#   -0.8   415       1.687    -9.1°  (-0.1589)
#   -1.0   423       1.245   -12.5°  (-0.2177)
#
# 両端の u=±1 の点は delta_max (0.3003) を覆うための足し点 (実測ではない)。
motor_driver:
  ros__parameters:
    steer_map_delta_rad: [-0.3003, -0.2177, -0.1589, -0.1279, -0.0898, 0.0, 0.0838, 0.1650, 0.2247, 0.2904, 0.3003]
    steer_map_u:         [-1.0,    -1.0,    -0.8,    -0.6,    -0.4,    0.0, 0.4,    0.6,    0.8,    1.0,    1.0]
