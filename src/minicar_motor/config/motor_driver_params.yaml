# motor_driver ノードのパラメータ（実機）。
#
#   [safety_node] --/cmd_vel--> [motor_driver] --PWM--> サーボ / ESC --> 車両
#
# 車両諸元 (wheelbase / delta_max / v_min / v_max) はここに**書かない**。
# minicar_bringup/config/vehicle_params.yaml が唯一の出所で、
# vehicle_params_file で渡す（launch が自動で渡す）。
# PWM カウントの実測値もここに書かない。minicar_motor/config/pwm_params.json が出所。
#
# ここに置くのは 2 種類だけ:
#   (A) 校正マップ  — 車両特性。delta[rad] -> u、v[m/s] -> u。実車を計測して埋める
#   (B) 電気的仕様  — PCA9685 / I2C の設定。部品と基板を替えたときだけ変わる
#
# ############################################################################
# 警告: (A) の校正マップと config/pwm_params.json は **未校正の暫定値**。
#   実車で計測していない。
#   - pwm_params.json は FaBo の notebooks/01_find_pwm.ipynb で
#     「左 / 中立 / 右」「前進 / 停止 / 後退」を測って差し替える。
#   - 校正マップは jetracer_ros2_handoff.md 【5-9】ステップ 1 と 【6-2】の手順で
#     「指令値 -> 実舵角」「指令値 -> 定常速度」を測ってから差し替える。
#   それまでは車輪を浮かせるか、即時に電源を切れる状態でしか走らせない。
# ############################################################################

motor_driver:
  ros__parameters:
    # 出力周期[Hz]。サーボの更新は 60Hz(下の pwm_freq_hz)なので、それより
    # 速く書いても PWM の周期以上には反映されない。制御 (MPPI 20Hz) より
    # 速くするのは、ウォッチドッグとスルーレート制限の粒度を細かくするため。
    rate: 50.0

    cmd_topic: "/cmd_vel_raw"
    # 下の 2 つは **launch が渡す**。ここは空のままにしておく。
    # 決め打ちにすると「別の諸元で走らせているつもりで既定を読んでいた」に
    # 気付けないので、ノード側は空だと起動時に落とす。
    vehicle_params_file: ""
    # FaBo の 01_find_pwm.ipynb が書き出す JSON と同じ形。実機で測った
    # ファイルを変換せずにそのままコピーできるよう、キー構成を変えていない。
    pwm_params_file: ""

    # --- 安全 ---
    # /cmd_vel がこれだけ来なければ中立へ落とす[s]。
    # ESC とサーボは最後のパルスをラッチし続けるので、指令が途切れただけでは
    # 止まらない。明示的に中立を書き続ける必要がある。
    # safety_node.cmd_timeout (0.3) と同値にしてある。上流が止まったとき
    # 二段構えで同じ時間内に止まる。
    #
    # 注意: FaBo の Notebook にはウォッチドッグもタイムアウトもデストラクタも
    # 無く、停止ボタンでスロットルだけ中立へ戻している(ステアは切ったまま)。
    # 下の安全機構はこちらで足したもので、FaBo 由来ではない。
    cmd_timeout: 0.3

    # 起動直後、これだけ中立を出してからスロットルを通す[s]。
    # 多くの ESC が「電源投入後に中立を一定時間受けること」をアーミング条件に
    # している。ここを飛ばすと ESC が入力を受け付けないか、機種によっては
    # 設定モードに入る。
    arm_neutral_duration: 2.0

    # 操舵指令の変化率上限[rad/s]。**サーボ機構の保護**が目的で、
    # 車両運動の制限 (加速度制限) は safety_node の担当。役割が違う。
    # 既定値は delta_max 0.30rad を 0.03s で振り切れる速さ ≒ サーボの
    # 実力 (Futaba S3004 クラス) と同程度。制御を鈍らせない範囲で、
    # 指令の飛び (NaN からの復帰、中立割り込みからの復帰) だけを丸める。
    steer_slew_rate_max: 10.0

    # --- 後退の扱い ---
    # TT-02 系の ESC は前進から直接後退へ行けない。FaBo の 01_find_pwm.ipynb の
    # set_back は「中立 -> 0.1s -> 中立 -> 0.1s -> 後退」の順を踏んでいる。
    # 負指令を素通しすると**ブレーキがかかるだけで下がらず**、safety_node の
    # スタック脱出 (recovery_speed を負にして出す) が無言で効かなくなる。
    #
    #   "neutral_neutral_reverse" — FaBo と同じ順を自動で踏む(既定)
    #   "direct"                  — そのまま出す (後退直行に対応した ESC 用)
    #   "disabled"                — 負指令を 0 にクランプして警告
    #
    # 実機で車輪を浮かせ、throttle に負値を入れて後退するか確かめてから決める。
    neutral_gap_duration: 0.1     # [s] 挟む中立の長さ。FaBo の sleep(0.1) と同値
    reverse_mode: "neutral_neutral_reverse"

    # --- (B) 電気的仕様 ---
    # backend を綴り間違えると起動時に落ちる。既定へ黙って落とさないのは、
    # 実機で「dryrun のまま出力しているつもり」になるのを防ぐため。
    backend: "dryrun"             # "dryrun" / "fabo_pca9685"
    steering_channel: 0           # FaBo の STEERING_CH
    throttle_channel: 1           # FaBo の THROTTLE_CH

    # I2C バス番号はボードで違う。FaBo の notebooks/17_run.ipynb の
    # board_settings より:
    #   JETSON_ORIN_NANO: 7   JETSON_ORIN: 7   JETSON_NANO: 1   NX/XAVIER: 8
    # 我々は Orin Nano なので 7。実機で i2cdetect -y -r 7 に 0x40 が出るか確認する
    # (同ノートの I2C 一覧: 0x08 プロポ値の吸い上げ / 0x3c OLED / 0x40, 0x70 PCA9685)。
    i2c_bus: 7
    i2c_address: 64               # 0x40。PCA9685 の既定アドレス

    # FaBo の実走 Notebook は SERVO_HZ=60。**50 ではない。**
    # PCA9685 のカウントはデューティ比なので、周波数を取り違えると同じ
    # カウントでもパルス幅が比例してずれる (= 舵角と速度が一様にずれる)。
    pwm_freq_hz: 60.0

    # 最後の砦。PCA9685 の 12bit 分解能そのもの。
    # pwm_params.json を手で書き換えたときだけ効く。
    count_min: 0
    count_max: 4095

    # --- (A) 校正マップ ---
    # ROS パラメータは配列の配列を持てないので、x と y を別配列で持つ。
    # 同じ長さで、x は狭義単調増加であること (違えば起動時に落ちる)。
    #
    # この段は「指令 -> 正規化値 u∈[-1,1]」まで。u -> PWM カウントの変換は
    # pwm_params.json が持つ。段を分けてあるのは更新される理由が違うため
    # (タイヤを替えたら校正マップ、サーボを替えたら pwm_params.json)。

    # |v| がこれ未満のとき、Twist に操舵情報が入っていない。
    # omega = v*tan(delta)/L なので v->0 では delta によらず omega->0 になる。
    # この領域では直前の舵角を保持する (中立へ戻すと、後退脱出の切り返しの
    # 途中で一瞬まっすぐになり抜けられなくなる)。
    v_eps: 0.05                   # [m/s]

    # 舵角[rad] -> 正規化操舵指令 u_s ∈[-1,1]。
    # 実測 (2026-10-20、接地、v 0.3 m/s で半周させ、外側後輪の軌跡の半径 r を
    # メジャーで測った)。後輪車軸中心の半径は R = r - 0.083 (トレッドの半分)、
    # delta = atan(0.257 / R)。
    #
    #   u      カウント  r [m]   delta
    #   +1.0   310       0.943   +16.6°  (+0.2904)
    #   +0.8   325       1.208   +12.9°  (+0.2247)
    #   +0.6   340       1.627    +9.5°  (+0.1650)
    #   +0.4   355       3.143    +4.8°  (+0.0838)
    #   -0.4   400       2.938    -5.1°  (-0.0898)
    #   -0.6   408       2.082    -7.3°  (-0.1279)
    #   -0.8   415       1.687    -9.1°  (-0.1589)
    #   -1.0   423       1.245   -12.5°  (-0.2177)
    #
    # 以前の直線マップ (±0.3003 <-> u=±1) では、右は指令の約 7 割しか
    # 切れていなかった (10/16・10/19 の bag 4 本の IMU ヨーレートでも同じ傾向)。
    # |u| < 0.4 は未測定で、0 と ±0.4 の間を線形に結んでいる。
    #
    # 右端 (423) は 10/10 に 440 だとサーボが唸ったため下げた値で、機構の限界。
    # 右は -0.2177 rad (R 1.18 m) より大きく切れない。左も 0.2904 rad まで。
    # MPPI は delta_max (0.3003) まで使う前提なので、ドライバの検証を通すため
    # 両端に「u=±1 のまま」の点を足して ±0.3003 まで覆っている。
    # -0.2177 を超える右の指令は u=-1 に張り付く (計画より膨らむ)。
    # 機構を直して右端を変えたら、右側を測り直すこと。
    # サーボの極性が逆なら pwm_params.json の left/right を入れ替える
    # (FaBo の 01_find_pwm.ipynb の Reverse チェックボックスと同じ扱い)。
    steer_map_delta_rad: [-0.3003, -0.2177, -0.1589, -0.1279, -0.0898, 0.0, 0.0838, 0.1650, 0.2247, 0.2904, 0.3003]
    steer_map_u:         [-1.0,    -1.0,    -0.8,    -0.6,    -0.4,    0.0, 0.4,    0.6,    0.8,    1.0,    1.0]

    # 速度[m/s] -> 正規化スロットル指令 u_t ∈[-1,1]。
    # 前進側は実測 (2026-10-15、接地、助走 1m + 計測 1m をストップウォッチで 3 回平均):
    #
    #   カウント  1m のタイム  速度
    #   377       -           動かない (ESC のデッドバンド内)
    #   375       5.0 s       0.20 m/s
    #   373       1.25 s      0.80 m/s
    #   371       0.80 s      1.25 m/s
    #   369       0.65 s      1.54 m/s
    #   367       0.65 s      1.54 m/s  <- 床ではここで頭打ちに見えた
    #
    # u は pwm_params.json の stop..front に対する割合なので、front を変えたら
    # ここも計算し直す。u = (stop - カウント) / (stop - front)。
    # 2026-10-16 に front を 363 -> 330 へ変更 (空転でモータが回り切る値)。
    # 上の実測カウントが変わらないよう u = (379 - カウント) / 49 で引き直した。
    # 330 付近の速度は未測定。1.54 m/s を超える指令は端点クランプで 369 のまま。
    #
    # 1 カウントで約 0.3 m/s 変わる (375 -> 373 で 0.2 -> 0.8) ので、速度の
    # 分解能はこれ以上細かくならない。
    # 0.001 -> 0.0816 の段差: 377 は動かず、376 は未測定。停止から確実に
    # 動き出すと分かっている 375 を最小にした。0 < v <= 0.20 の指令はすべて
    # 375 (= 0.20 m/s) になる。デッドバンドに落ちて「指令しているのに
    # 止まったまま」になるより、少し速めに出るほうを選んだ。
    #
    # 上の表は**床**の値で、コースでは全く合わなかった。
    #
    # コース上の実測 (2026-10-19、速度 PI で走った bag 2 本のほぼ定常な区間。
    # tools/bag_analysis/motor_speed/count_speed.py):
    #
    #   カウント            364   363   362   361   360
    #   直線寄り (<8°)      -     0.61  0.66  0.69  0.90 m/s
    #   舵いっぱい (>=12°)  0.49  0.47  0.49  0.51  -
    #
    # ミューが高いコースでは 0.45〜0.85 m/s がほぼ 360〜363 カウントに収まり、
    # 舵いっぱいだと同じカウントで約 0.17 m/s 遅い。以前のマップ
    # (10/16 の bag から c = 372.6 - 20v で引いた直線) は傾きが急すぎて、
    # MPPI の指令が上下するたびにフィードフォワードが 5〜6 カウント動き、
    # 積分がそれを打ち消す綱引きで速度が揺れていた (u_i の標準偏差が最大)。
    #
    # 下の u は、直線と舵いっぱいの中間を取って引き直したもの
    # (u = (379 - カウント) / 49)。
    #   v      0.001  0.20   0.80   1.25   1.54
    #   count  367    364    361    356    352
    # 1.05 m/s より上は定常の実測が無く、推定。
    # 0.001 の 367 は speed_u_min と同じ。車輪を浮かせた低速ベンチ (--v 0.06 など)
    # でも車輪が回るので、回したくないときは speed_control:=off でも回ることに注意。
    # 実走データを再生するモデルでは、以前のマップより速度の振れ幅が約 2 割、
    # 誤差 RMS が約 1 割減った (つなぎ目からの再発進は +0.1s 程度)。
    #
    # speed_control: "pi" ではこのマップはフィードフォワード (出発点) で、
    # ずれは PI が埋める。off のときはこれがそのまま出る。
    #
    # 以前の launch の throttle_map_u 上書き ([...,0.5714,...,0.6939]、
    # 351〜345 カウント) は不要。上書きすると PI のフィードフォワードもそれになる。
    #
    # 後退側は未測定のまま (暫定: -0.10 の段差、-0.50 で頭打ち)。back は変えていない。
    throttle_map_v_mps: [-1.0, -0.001, 0.0, 0.001,  0.20,   0.80,   1.25,   1.54]
    throttle_map_u:     [-0.5, -0.10,  0.0, 0.25,   0.30,   0.37,   0.47,   0.55]

    # --- 速度 PI (前進のみ) ---
    #   u_t = throttle_map(v_cmd) + kp * e + ki * ∫e dt,  e = v_cmd - v_odom
    #
    # オープンループのままだと、同じカウントでも負荷で速度が変わり、
    # 止まっても出力が増えないので動き出せない。2026-10-16 の bag では
    # つなぎ目で 360〜364 カウントのまま 7 秒以上、舵いっぱいのコーナーで
    # 368 カウントのまま 100 秒以上止まっていた。
    #
    #   "off" — 従来どおり throttle_map をそのまま出す
    #   "pi"  — /odom の実速度で補正する。/odom が odom_timeout 来なければ
    #           自動で off と同じ出力に戻る (/motor/speed_ctrl の state が -1)
    #
    # launch 引数 speed_control:=off / pi で上書きできる (A/B 比較用)。
    speed_control: "pi"

    # micro-ROS の車輪エンコーダ。約 37Hz、分解能 0.026 m/s。
    # bag で AMCL と走行距離が 2% 以内で一致することを確認済み。
    odom_topic: "/odom"
    # 実機で /odom の受信間隔は最大 0.229s あった (2026-10-19)。0.2 だと
    # そのたびに PI が止まって積分が捨てられるので、余裕を見て 0.3。
    odom_timeout: 0.3             # [s]
    speed_meas_tau: 0.05          # [s] 実速度の LPF。量子化の段差をならすだけ

    # ゲインは机上シミュレーションで決めた。モデルは bag から作った
    # 1 次遅れ (時定数 0.8s) + 静止摩擦 + つなぎ目の段差。
    #   - bag と同じ条件のつなぎ目で、オープンループは永久に停止したが、
    #     PI は 0.3〜0.5s で再発進した
    #   - 速度ゲインが 3 倍違っても (コースと床の差) 発振しない
    # 単位: kp は u/(m/s)、ki は u/m。1 カウント = 1/49 ≈ 0.02 u。
    #
    # 初回の実走 (2026-10-19, ki 0.6 / i_min -0.4 / 下限なし) の結果:
    #   - 実速/指令は 0.93 (オープンループの 10/16 夜は 0.34〜0.38)。
    #     舵いっぱい 0.5 m/s の定常旋回では u_i は +0.02 程度だった
    #     (直線・高速側ではマップが強すぎた。上のマップは 10/20 に引き直した)
    #   - ただし指令を追い越すと出力を中立の手前 (369〜370) まで下げ、
    #     0.3 m/s まで落ちてから押し上げる、を繰り返した
    # 出力の遅れ 0.2s を入れたモデルに同じ指令を流すと、ki 0.4 / i_min -0.15 で
    # 追い越しの時間が 2〜3 割減った。下げる側はマップが合っているので小さくてよい。
    #
    # 速度の揺れをさらに抑えたいときは ki 0.25 も候補 (モデルでは振れ幅がさらに
    # 1 割減る)。代わりに大きな段差からの再発進が 0.3〜0.5s 遅くなる。
    speed_kp: 0.15
    speed_ki: 0.4
    # 積分項の範囲 [u]。押し出す側 (+) はつなぎ目・発進用に大きく残す。
    speed_i_min: -0.15
    speed_i_max: 0.3
    # 出力の絶対上限 [u]。0.70 = 345 カウント (実走でコース上 1.1 m/s 以上出た)。
    # /odom が 0 を返し続ける故障でもここより上には出ない。
    # 最高速を抑えたいときはここを下げる (本来は nav2 の vx_max で抑える)。
    speed_u_max: 0.85
    # 前進中の出力の下限 [u]。0.25 = 367 カウント (コースで約 0.3 m/s)。
    # 追い越したあとに中立付近まで下げて止まりかけるのを防ぐ。
    # マップの値 (u_ff) がこれより小さい指令では u_ff が下限になる。
    speed_u_min: 0.25
