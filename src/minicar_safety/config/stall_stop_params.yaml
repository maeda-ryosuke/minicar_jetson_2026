# 停止検知フィルタ (実機) のパラメータ。
#
#   controller_server --/cmd_vel_raw--> [stall_stop_node] --/cmd_vel--> [motor_driver]
#
# 前進を指令しているのに /odom の実速度が 0 のまま stall_time 続いたら
# ゼロ指令に差し替えてラッチする。解除は
#   ros2 service call /stall_stop_node/reset std_srvs/srv/Trigger
# 空転 (車輪が回っていて車体が止まっている) は検知しない。
#
# 既定値は過去の bag (10/16 オープンループ 2 本、10/19 速度 PI 2 本) に
# この判定を流して決めた:
#   - 速度 PI の 2 本は、通常走行の約 90〜120 秒間にトリップ 0 回。
#     トリップしたのは PI が出力上限 (345 カウント) に張り付いたまま実速 0 が
#     1 秒以上続いた場面だけ (壁への接触など)
#   - 走行中に実速 0 が 0.5〜1.0 秒だけ出る場面はほぼ無い (1.0 秒を超えるか、
#     0.5 秒未満かに分かれる)
#   - 芝生 (10/23) は 0.07 m/s まで落ちるが 0 にはならない

stall_stop_node:
  ros__parameters:
    in_topic: "/cmd_vel_raw"
    out_topic: "/cmd_vel"
    odom_topic: "/odom"

    cmd_min: 0.1        # [m/s] これより大きい前進指令のときだけ判定 (MPPI の vx_min は 0.5)
    speed_zero: 0.03    # [m/s] 実速がこれ未満なら止まっている。/odom の分解能 0.026 の 1 段
    stall_time: 1.0     # [s]   止まっている状態がこれだけ続いたら停止

    # 起動 / リセット後、実速が一度これを超えるまでは判定しない [m/s]。
    # プロポのマニュアルモードで待っている間や、置いた直後に止めてしまわないため
    # (どの bag も走り出すまでに 4〜37 秒、指令だけ出て止まっている時間がある)。
    # 裏を返すと、壁に押し付けたまま起動 / リセットすると止まらない。
    arm_speed: 0.2

    # /odom がこれ以上来ていなければ判定しない [s]。途絶時の停止は
    # motor_driver の odom_lost_stop (1.0s) が受け持つ。odom_timeout と同値。
    odom_timeout: 0.3
