# 停止検知と後退復帰のフィルタ (実機) のパラメータ。
#
#   controller_server --/cmd_vel_raw--> [stall_stop_node] --/cmd_vel--> [motor_driver]
#
# 前進を指令しているのに /odom の実速度が 0 のまま stall_time 続いたら、
# recovery_duration だけ後退してから素通しへ戻る。後退しても前進できないまま
# max_recoveries 回続いたら停止してラッチする。解除は
#   ros2 service call /stall_stop_node/reset std_srvs/srv/Trigger
# 状態は /safety/stall_state ("pass" / "recover" / "stop")。
# 空転 (車輪が回っていて車体が止まっている) は検知しない。
#
# 判定の既定値は過去の bag (10/16 オープンループ 2 本、10/19 速度 PI 2 本) に
# この判定を流して決めた:
#   - 速度 PI の 2 本は、通常走行の約 90〜120 秒間にトリップ 0 回。
#     トリップしたのは PI が出力上限 (345 カウント) に張り付いたまま実速 0 が
#     1 秒以上続いた場面だけ (壁への接触など)
#   - 走行中に実速 0 が 0.5〜1.0 秒だけ出る場面はほぼ無い (1.0 秒を超えるか、
#     0.5 秒未満かに分かれる)
#   - 芝生 (10/23) は 0.07 m/s まで落ちるが 0 にはならない

stall_stop_node:
  ros__parameters:
    in_topic: "/cmd_vel_raw"
    out_topic: "/cmd_vel"
    odom_topic: "/odom"

    cmd_min: 0.1        # [m/s] これより大きい前進指令のときだけ判定 (MPPI の vx_min は 0.5)
    speed_zero: 0.03    # [m/s] 実速がこれ未満なら止まっている。/odom の分解能 0.026 の 1 段
    stall_time: 1.0     # [s]   止まっている状態がこれだけ続いたら後退

    # 起動 / リセット後、実速が一度これを超えるまでは判定しない [m/s]。
    # プロポのマニュアルモードで待っている間や、置いた直後に動かしてしまわないため
    # (どの bag も走り出すまでに 4〜37 秒、指令だけ出て止まっている時間がある)。
    # 裏を返すと、壁に押し付けたまま起動 / リセットすると検知しない。
    arm_speed: 0.2

    # /odom がこれ以上来ていなければ判定しない [s]。途絶時の停止は
    # motor_driver の odom_lost_stop (1.0s) が受け持つ。odom_timeout と同値。
    odom_timeout: 0.3

    # --- 後退による復帰 ---
    # 壁に密着した車が前進しながら曲がるのは幾何的に無理なので、後退時は
    # 切り返しと同じく舵を逆に切る (詰まったときの指令の曲率 omega/v の符号を反転)。
    # 後ろは見ていないので、時間と速度で短く打ち切る (0.4 x 1.5 = 最大 0.6m)。
    # 後退は実機で未確認。motor_driver の reverse_mode と後退側の速度マップ
    # (未測定) 次第で、ブレーキだけかかって下がらない可能性がある。
    # 下がらなければ max_recoveries 回で停止する。
    recovery_speed: 0.4         # [m/s] 後退速度 (符号は内部で負にする)
    recovery_duration: 1.5      # [s]   後退を続ける時間
    # 後退しても前進 (arm_speed 以上) できないまま、続けてこの回数後退したら停止。
    max_recoveries: 3
