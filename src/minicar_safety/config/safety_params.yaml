# 安全フィルタ(指令チェーンの最終段)のパラメータ。
#
#   [mppi_node] --/cmd_vel_raw--> [safety_node] --/cmd_vel--> 実機走行系
#
# 制御方式に依存しないので、pursuit を MPPI に差し替えてもこのノードと
# この設定はそのまま使える。

safety_node:
  ros__parameters:
    # 出力周期[Hz]。加速度制限の粒度もこれで決まる。
    rate: 20.0

    # /cmd_vel_raw が何秒来なければ停止するか[s]。
    # 制御ノードが落ちた場合の停止経路を兼ねる。実機走行系が最後の指令を
    # ラッチする可能性を前提に、タイムアウト時は停止指令をpublishする。
    cmd_timeout: 0.3

    # --- スタック検知 ---
    # 判定は IMU の実測角速度で行う。/odom は車輪回転と操舵角からの推測航法
    # なので、壁に押し付けられて空転していても「旋回中」を返し続け、衝突を
    # 原理的に検知できない(実測: odom 0.49rad/s のとき IMU 0.000)。
    stuck_cmd_threshold: 0.15   # [rad/s] これ以上の旋回を指令していて
    stuck_imu_threshold: 0.05   # [rad/s] IMU 実測がこれ未満なら怪しい
    stuck_time: 1.0             # [s]     その状態がこれだけ続いたら脱出開始

    # 前進できているかの判定。旋回だけ見ていると「ほぼ直進のまま詰まった」
    # 場合を見逃す(MPPI 版で実際に起きた: omega が 0.02〜0.14 と閾値未満に
    # 収まり 90秒間まったく検知されなかった)。
    # 前進の実測に使えるセンサが無い(IMU の加速度は等速と静止を区別できず、
    # odom は嘘をつく)ので、スキャン自体の変化量を使う。静止していれば
    # センサノイズ相当(sigma=0.01m なら平均 0.011m)にしかならない。
    stuck_v_threshold: 0.15     # [m/s] これ以上の前進を指令していて
    stuck_scan_threshold: 0.02  # [m]   連続スキャンの平均変化がこれ未満なら怪しい

    # --- 後退による脱出 ---
    # 壁に密着した車が前進しながら曲がるのは幾何的に不可能なので、制御
    # ノードの指示を聞き続けても永久に抜けられない。後退中は舵を逆に切る
    # (切り返しと同じ。omega = v*kappa なので v<0 で同じ向きに回頭を続ける
    # には kappa の符号反転が要る)。
    #
    # 現在の LiDAR は 270deg で真後ろが見えず後退の安全確認ができないため、
    # 時間と速度で保守的に打ち切る(0.4 x 1.5 = 最大 0.6m)。
    # 実機 TG30 は 360deg あるので、実機では後方も見て判定できる。
    recovery_speed: 0.4         # [m/s] 後退速度(符号は内部で負にする)
    recovery_duration: 1.5      # [s]   後退を続ける時間

    in_topic: "/cmd_vel_raw"
    out_topic: "/cmd_vel"
    imu_topic: "/imu"
    # bringup の launch から共有ファイルのパスを渡す。
