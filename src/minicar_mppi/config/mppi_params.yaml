# MPPI のチューニングパラメータ。
# 車両諸元(wheelbase / half_width / lidar_x_from_rear_axle / limits.*)は
# vehicle_params.yaml から読むのでここには書かない。
#
# コストの重みは「互いのスケールが釣り合っていること」が決定的に効く。
# 実装中、ここを外して2度失敗した:
#   - w_speed=1 では 30step 這っても 24 で、衝突 1step の 3000 に対し 1/125。
#     結果「壁の手前まで這って止まる」が最適解になり、横に避けなくなった
#   - w_goal=8 では終端誤差 1m でも 8 で、経路コスト ~900 に埋もれて
#     FTG の方向指示が全く効かなかった
#   - w_collision=3000 + lam=3000 では、衝突項が sd を支配する場面に lam を
#     合わせた結果、通常走行では重みがほぼ一様になって舵が切れなくなった
#     (単体テストの操舵系3件が全滅)。lam は w_collision と必ず一緒に動かす
# 重みを触るときは「その項が満額で何点になるか」を他項と比べること。
# lam だけは絶対値ではなく**サンプル間の sd**と比べること。
#
# 現在値はシミュレーションで得た初期値。実機の速度、操舵遅れ、LiDAR取付、
# 路面摩擦に合わせた再計測・再調整が終わるまで無人走行に使用しないこと。

mppi_node:
  ros__parameters:
    control_rate: 20.0     # /scan は 10Hz だが制御は倍で回す
    scan_timeout: 0.5      # これを超えたら publish を止める(safety_node が停止させる)
    target_timeout: 0.5    # FTG 目標が途切れたら goal 無しで走る(衝突回避は続く)

    # --- ホライゾン ---
    # T*dt = 1.8s。v=1.2m/s で約 2.1m 先まで見る。ヘアピンで曲がりきるのに
    # 必要な弧長(実測 1.29m)より長いこと。ここが短いと FTG と同じく
    # 「気づいたときには手遅れ」になる。
    K: 800
    T: 30
    dt: 0.06

    # 温度。「コスト差がどれだけなら意味のある差か」の物差しで、
    # コストの絶対値ではなく**ばらつき(sd)**と同オーダーに合わせる。
    # lam だけ離れたサンプルの重みが 1/e に落ちるので、sd より小さいと
    # ほぼ全サンプルが捨てられて実質 argmax になる。
    #
    # 逆に大きすぎると重みがほぼ一様になり、更新 Σw*eps が平均 0 に潰れて
    # 舵が切れなくなる(論文 Fig.3 の「高 lam は重み無し平均に近づく」)。
    # ESS が高いほど良いわけではない。オフライン掃引の実測:
    #     lam    隙間回避の終端y   ヘアピンの終端y   ESS/800
    #     100        -0.81           -0.54          377
    #     300        -0.73           -0.42          585   <- 現行
    #     1000       -0.38           -0.15          751
    #     3000       -0.02           -0.05          789   <- 舵が消える
    # 3000 は ESS こそ高いが、単体テストの操舵系3件が全滅していた。
    #
    # 一度 3000 まで上げたのは「膠着時に衝突項が sd を支配する」のが理由
    # だったが、それは w_collision 側で潰した(下記)。合計 sd は今
    # 廊下 375 / コーナー進入 430 / 壁に密着 363 とほぼ一定なので、
    # 300 一つで全場面に合う。変えたら ESS と単体テストを必ず実測すること。
    lam: 300.0

    sigma_a: 1.2           # 加速度ノイズ[m/s^2]
    sigma_delta: 0.20      # 舵角ノイズ[rad]。delta_max=0.2516 の 4割

    # --- 局所距離場 ---
    # 遠方ほどビームが疎になり壁が離散化で穴あきになるため、範囲は欲張らない。
    # grid_dilate=1 で占有セルを膨らませ、ロールアウトのすり抜けを防ぐ。
    grid_x_min: -1.0
    grid_x_max: 6.0
    grid_y_half: 3.5
    grid_res: 0.05
    grid_dilate: 1

    # --- コスト ---
    # 衝突。有限値にすること(inf だと全滅時に解が出ない)。
    # 大きすぎると衝突項だけがコストの sd を支配し、場面ごとに sd が何倍も
    # 振れて lam を一つに決められなくなる。実測した合計 sd:
    #     w_collision   廊下   コーナー進入   壁に密着
    #        3000       375       789          363    <- 2.1倍も振れる
    #        1000       375       430          363    <- ほぼ一定
    # 衝突はラッチするので t 歩目で当たると w_collision*(T-t) 効く。
    # 1000 でもホライゾン中程なら 15000 で、抑止力は十分ある。
    # 下限は 700 付近: 500 まで下げると「回り込めない壁で減速」が落ちる。
    w_collision: 1000.0
    w_obs: 300.0           # ソフト回避。この滑らかな勾配が「膨らんで曲がる」を生む
    d_safe: 0.40           # [m] これより壁に近いとコストが立ち上がる
    w_goal: 2000.0          # FTG 目標点への終端コスト。0 で FTG 無効(切り分け用)
    # 這い続けるコスト = 150*(1.2-0.3)^2*30 = 3645。比較対象はラッチ後の
    # 衝突総額 w_collision*(T-t) で、t=15 なら 15000、t=27 で 3645 と拮抗する。
    w_speed: 150.0
    v_target: 1.2
    w_smooth: 20.0

    # 壁際でFTGが左/右を示しても、終端距離だけでは「直進してx方向だけ
    # 近づいた軌道」と区別できない。ESDF距離が下の閾値未満の予測区間では、
    # 各位置からFTG目標点を見た方位と車体姿勢の誤差[rad^2]を加算する。
    # 時間重み ((T-t)/T)^heading_time_power により早い旋回を優先し、
    # 「今は減速、旋回はホライゾン後半」を繰り返す先送りを抑える。
    w_heading: 200.0
    heading_danger_distance: 0.60  # [m] この距離から方向コストを立ち上げる
    heading_time_power: 1.0        # 0で全時刻同率。大きいほど先頭側を重視

    # 操舵一次遅れ[s]。0.067はシミュレーション由来の初期値。
    # 実機サーボのステップ応答を計測して差し替えること。
    steer_tau: 0.067

    # --- 可視化 ---
    viz_samples: 800        # rviz に出すサンプル軌道の本数。0 で無効
    publish_esdf: true

    # コスト内訳の記録先(CSV)。"" で無効。ログは 1秒スロットルが掛かって
    # いて全周期ぶんが残らないので、後から掃引するにはこちらを使う。
    cost_log_file: "/tmp/mppi_cost.csv"

    scan_topic: "/scan"
    target_topic: "/ftg/target_point"
    odom_topic: "/odometry/filtered"
    cmd_topic: "/cmd_vel_raw"
    # bringup の launch から共有ファイルのパスを渡す。
