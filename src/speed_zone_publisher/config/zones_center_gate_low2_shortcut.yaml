# maps/raceline_center_gate_low2_shortcut.csv(西のヘアピンを通らないショートカット版)用の
# エリア定義(map 座標)。書き方は zones.yaml と同じ。
#
# この線は 南東 -> 中央の仕切りの先端 -> 北東 と、半径 0.86 m のヘアピンが間 0.3〜0.4 m で
# 3 つ続く。間で 3.0 に戻しても加速しきれないので、まとめて 1 つのエリアにした。
# 北東の出口の S 字(半径 1.31 m、s 14.5〜15.3 m)も含める。
# 進入側は南東ヘアピンの曲がり始め(s 3.1 m、x 2.6)の 1.8 m 手前(x 0.9)から。
# 減速距離 (3.0² - 2.0²) / (2·2.0) = 1.25 m より長い。
default_speed: 2.8
zones:
  - name: hairpins_east
    speed: 1.6
    polygon: [[-1.5,0.8],[-1.5, -0.8], [4.5, -0.8], [4.5, 4.8], [1.6, 4.8], [1.6, 3.6], [0.9, 3.6]]

  - name: start_deaccel
    speed: 2.0
    polygon: [[-3.6, 0.8],[-3.6, -0.8], [-1.0, -0.8], [-1.0, 0.8]]
