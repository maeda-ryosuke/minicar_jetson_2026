# FTG のチューニング用パラメータ。
#
# vehicle_params.yaml（車両諸元・物理制約、滅多に変わらない）とは
# 意図的に分けてある。こちらは走らせながら
#   ros2 param set /ftg_node range_clip 8.0
# のように実行中に変えて詰める前提の値。
#
# ROS パラメータ形式なので、ノード名 ftg_node と一致させること。

ftg_node:
  ros__parameters:
    # 探索する前方コーンの半角[deg]。
    # LiDAR の FOV は 270°(±135°) あり、制限しないと後方の巨大な空きが
    # 必ず最長 gap になって車が後ろを向く。90 は「真横まで見る」設定。
    # 壁際で挙動が暴れるようなら 60〜70 に絞る。
    cone_half_angle_deg: 90.0

    # 距離のクリップ[m]。センサ上限は 30m だが、コース規模に対し過剰。
    # 遠方の値が gap の長さ比較を支配して判断が鈍るため近距離で切る。
    range_clip: 5.0

    # 移動平均の窓幅[beam]。角度分解能 ~0.42deg/beam なので 5 で約 2.1deg。
    # 大きくすると gap 境界が鈍り、小さいとビームノイズで境界が暴れる。
    smooth_window: 5

    # 安全バブルの半径[m]。LiDAR ビームは太さゼロの線だが車には幅がある。
    # 最近傍の障害物をこの半径ぶん膨らませて「線が通る=車が通る」に直す。
    #
    # 下限は車体半幅だが、それは 0.075m(ボディ箱)ではなく 0.095m。
    # タイヤ(y=±0.083, 幅0.024)がボディより 2cm 外に出ているため、
    # 実際の全幅は 0.19m ある(vehicle_params.yaml の half_width)。
    # 当初 0.20 はボディ箱基準で余裕 0.125m のつもりだったが、
    # タイヤ基準では 0.105m しかなかった。0.22 で当初の意図どおりになる。
    # 小さくすると壁を攻めるが擦りやすくなる。
    bubble_radius: 0.22

    # gap 内の狙点を選ぶとき「最大値の何割以内を最遠点群とみなすか」。
    # range_clip で頭打ちになったビームが大量に同値になるため argmax は
    # 使えず（同値の先頭に寄る）、この許容幅で拾った塊の中央を狙う。
    best_point_tolerance: 0.05

    # 狙点の左右フリップを抑えるヒステリシス[beam/rad]。
    # 左右にほぼ同幅の開口があると幅だけの比較では毎スキャン勝者が入れ替わり、
    # 目標が +75deg / -75deg と交互に振れて舵が相殺され、旋回しないまま
    # 壁へ直進する（実測）。直前の選択から離れた候補を「幅 gain*Δ[rad] 本ぶん
    # 狭い」と見なして減点する。0 で無効。
    # 60 なら 2.6rad(±75degの往復)の乗り換えに 156beam ぶんの優位が必要。
    hysteresis_gain: 60.0

    # 前進バイアス[beam/rad^2]。真正面(0deg)から離れた候補を二乗で減点する。
    # 無効(0)だと、大きな方位角を出し続けた結果 Pure Pursuit が曲率上限で
    # 飽和し、車が最小旋回半径 1.0m の円を回り続ける（実測: 45秒で4.86周）。
    # 二乗なので緩いコーナーは安く、大角度だけ高い:
    #   gain=100 のとき 20deg->12beam / 45deg->62 / 74deg->166 の減点
    # (gap 幅は 300〜400beam 程度なので、166 は「効くが塞がない」水準)
    # 上げすぎると本当に必要な急コーナーも曲がれなくなる。
    forward_bias_gain: 100.0

    # Pure Pursuit の前方注視距離[m]（後輪車軸から測る）。
    # 曲率が kappa = 2*sin(bearing)/lookahead になるため、
    # r_min=1.0m(kappa_max=1.0) では追従できる方位角に上限が生まれる:
    #   lookahead 0.5m -> 14.5deg / 1.0m -> 30deg / 1.5m -> 48.6deg / 2.0m -> 制限なし
    # FTG は最大 90deg の狙点を出すので、短いと曲がりきれずアンダーになる。
    # 逆に長すぎるとコーナーで内側を切りすぎる。まず 1.5 から。
    lookahead_distance: 1.5
    lookahead_min: 0.3

    scan_topic: "/scan"
    filtered_topic: "/ftg/scan_filtered"
    target_topic: "/ftg/target_point"
    marker_topic: "/ftg/markers"

    # 車両諸元(plain YAML)。走行中に触らない物理量はこちらに置く。
    # bringup の launch から共有ファイルのパスを渡す。
