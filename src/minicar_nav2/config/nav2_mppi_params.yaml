# レースライン追従専用の Nav2 controller_server 設定。
# planner_server / BT navigator / global costmap は使わず、minicar_raceline が
# FollowPath action を直接送る。障害物回避を追加するまでは Costmap layer と
# Cost/Obstacles critic を有効にしない。

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # Humble では progress checker は単数形パラメータ。
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # 20 Hz、2.8 s horizon。0.5 m/s なら予測距離は約1.4 m。
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.20
      vx_max: 0.50
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.50
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 0.0
      az_max: 2.0

      prune_distance: 3.0
      max_robot_pose_search_dist: 2.0
      transform_tolerance: 0.20
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 1.0

      # 初期構成では経路追従だけを評価する。CostCritic と
      # ObstaclesCritic は Costmap の障害物レイヤ追加時に同時に有効化する。
      critics: [
        "ConstraintCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

# controller_server は Costmap2DROS を必ず所有するため、レイヤ無しの空グリッドを
# odom 座標系で起動する。MPPIがmapのPathをここへ変換するためにも必要。
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8.0
      height: 8.0
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.20
      robot_radius: 0.12
      track_unknown_space: false
      always_send_full_costmap: false
      plugins: []
      filters: []

lifecycle_manager_nav2_mppi:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server"]
