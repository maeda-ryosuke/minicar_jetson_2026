# AMCL(nav2_amcl)による保存済み地図上の自己位置推定。slam_localization_amcl.launch.py が読む。
#
# slam_toolbox localization は連続照合の相手が直近scanのrolling bufferで、地図へ引き戻すのが
# ループ閉じ込みだけだった(202610101840 で周の途中はほぼEKFの推測航法)。AMCLは更新のたびに
# scanを固定地図の尤度場と照合する。
#
# TF: map -(amcl)-> odom -(EKF, ホスト側)-> base_link。slam_toolbox と同じ契約。
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan_filtered
    map_topic: map
    tf_broadcast: true
    # slam_toolbox の transform_timeout と同じ。
    transform_tolerance: 0.2

    # 起動時の姿勢。launch引数 initial_x/y/yaw で上書きする(slam の map_start_pose と同じ意味)。
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

    # Ackermannだが、odom->base_link(EKF)の増分に載せるノイズモデルとしては差動で足りる。
    # 横滑り成分(alpha5)を持つ omni は使わない。
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # odomの誤差の大きさ。EKFが良いので小さめにし、粒子を狭く保って隣の通路への吸着を防ぐ。
    # 1: 回転→回転, 2: 並進→回転, 3: 並進→並進, 4: 回転→並進
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    # scan_filter(前方240deg・2 m)と揃える。後方は車体が映る。
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 2.0
    max_beams: 120
    z_hit: 0.8
    z_rand: 0.2
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.05
    # 壁からこの距離までを尤度場として持つ。通路幅(約1.2 m)の半分程度。
    laser_likelihood_max_dist: 0.5
    do_beamskip: false

    max_particles: 2000
    min_particles: 300
    pf_err: 0.05
    pf_z: 0.99
    # 0.02 m / 約1deg ごとに照合する(slam は 0.3 m ごと)。
    # 202610101840 の再生比較(tools/slam_sweep/amcl_conditions.yaml)で、0.05 より補正の跳びが減った
    # (5cm超 64→約45回、最大 0.33→0.18 m)。一致率は変わらず、CPU は PC 1コアの約2.5%。
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    # 見失い時のランダム粒子注入は、平行な通路へ飛ぶ原因になるので使わない。
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: false
    # launch引数 map_yaml で上書きする。
    yaml_filename: /maps/track_v1.yaml
