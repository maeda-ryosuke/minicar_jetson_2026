# AMCL検証の条件定義。amcl_sweep.py が読む。
# 基準: src/minicar_bringup/config/amcl_localization.yaml をそのまま使う(A00)。
# amcl: amcl パラメータへの上書き / slam: slam_toolbox_localization.yaml への上書き
# engine: slam は比較用に現行の slam_toolbox localization を同じ再生条件で流す。
conditions:
  - {name: S00_slam_current, engine: slam}
  - {name: A00_base}
  # odomノイズ(EKFをどれだけ信用するか)
  - {name: A01_alpha005, amcl: {alpha1: 0.05, alpha2: 0.05, alpha3: 0.05, alpha4: 0.05}}
  - {name: A02_alpha02,  amcl: {alpha1: 0.2, alpha2: 0.2, alpha3: 0.2, alpha4: 0.2}}
  - {name: A03_alpha04,  amcl: {alpha1: 0.4, alpha2: 0.4, alpha3: 0.4, alpha4: 0.4}}
  # 照合の頻度
  - {name: A04_upd002, amcl: {update_min_d: 0.02, update_min_a: 0.02}}
  - {name: A05_upd015, amcl: {update_min_d: 0.15, update_min_a: 0.1}}
  # 尤度場
  - {name: A06_sigma003, amcl: {sigma_hit: 0.03}}
  - {name: A07_sigma01,  amcl: {sigma_hit: 0.1}}
  - {name: A08_lmax03,   amcl: {laser_likelihood_max_dist: 0.3}}
  - {name: A09_lmax10,   amcl: {laser_likelihood_max_dist: 1.0}}
  - {name: A10_zhit09,   amcl: {z_hit: 0.9, z_rand: 0.1}}
  - {name: A11_zhit06,   amcl: {z_hit: 0.6, z_rand: 0.4}}
  # beam数・粒子数
  - {name: A12_beams60,  amcl: {max_beams: 60}}
  - {name: A13_beams240, amcl: {max_beams: 240}}
  - {name: A14_pf500,    amcl: {min_particles: 100, max_particles: 500}}
  - {name: A15_pf5000,   amcl: {min_particles: 1000, max_particles: 5000}}
  # 第2段: 一致率はどの条件も93-95%で差が小さい。補正の跳びが少なかった軸
  # (照合の頻度 A04、粒子数 A15、beam数 A13)を組み合わせる。
  - {name: B01_upd002_pf5000,  amcl: {update_min_d: 0.02, update_min_a: 0.02, min_particles: 1000, max_particles: 5000}}
  - {name: B02_upd002_beams240, amcl: {update_min_d: 0.02, update_min_a: 0.02, max_beams: 240}}
  - {name: B03_upd002_sigma003, amcl: {update_min_d: 0.02, update_min_a: 0.02, sigma_hit: 0.03}}
  - {name: B04_upd002_pf5000_beams240, amcl: {update_min_d: 0.02, update_min_a: 0.02, min_particles: 1000, max_particles: 5000, max_beams: 240}}
  - {name: B05_upd001, amcl: {update_min_d: 0.01, update_min_a: 0.01}}
  - {name: B06_upd002_alpha005, amcl: {update_min_d: 0.02, update_min_a: 0.02, alpha1: 0.05, alpha2: 0.05, alpha3: 0.05, alpha4: 0.05}}
  # 再現性の確認(粒子フィルタは乱数で毎回結果が変わる)。A04 と B04 の再実行。
  - {name: R1_A04_upd002, amcl: {update_min_d: 0.02, update_min_a: 0.02}}
  - {name: R2_A04_upd002, amcl: {update_min_d: 0.02, update_min_a: 0.02}}
  - {name: R1_B04_upd002_pf5000_beams240, amcl: {update_min_d: 0.02, update_min_a: 0.02, min_particles: 1000, max_particles: 5000, max_beams: 240}}
  - {name: R2_B04_upd002_pf5000_beams240, amcl: {update_min_d: 0.02, update_min_a: 0.02, min_particles: 1000, max_particles: 5000, max_beams: 240}}
